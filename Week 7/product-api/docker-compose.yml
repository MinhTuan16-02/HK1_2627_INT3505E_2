services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-lab-password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
  migrate:
    build: .
    environment: &api_environment
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-local-lab-password}@db:5432/${POSTGRES_DB:-appdb}
      APP_CONFIG: product_api.config.ProductionConfig
      SECRET_KEY: ${SECRET_KEY:-compose-local-lab-secret}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    command: ["flask", "--app", "wsgi:app", "db", "upgrade"]
    healthcheck:
      disable: true
  api:
    build: .
    environment: *api_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-5000}:5000"
    restart: unless-stopped
volumes:
  pgdata:
